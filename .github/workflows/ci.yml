name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: [3.2, 3.3, 3.4, "4.0", "jruby-10.0", "jruby-10.1"]
        bundler-version: [4.1.0.beta2]
    env:
      BUNDLER_VERSION: ${{ matrix.bundler-version }}
      BUNDLE_LOCKFILE: active
      # faster startup for the many short-lived bundler processes the specs run
      JRUBY_OPTS: --dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: latest
          bundler: ${{ matrix.bundler-version }}
          bundler-cache: true
      - name: Run tests
        run: bin/rspec

  lint:
    runs-on: ubuntu-latest

    env:
      BUNDLE_LOCKFILE: active
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
          bundler: 4.1.0.beta2
          rubygems: latest
      - name: Run RuboCop
        run: bin/rubocop
        timeout-minutes: 2
